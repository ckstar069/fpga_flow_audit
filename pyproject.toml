[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fpga-flow-audit"
version = "0.1.0"
description = "FPGA progressive-design audit helper for znxt_ofdm"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fpga-flow-audit = "fpga_flow_audit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-config=pyproject.toml"

[tool.coverage.run]
source = ["fpga_flow_audit"]
data_file = "/tmp/fpga_flow_audit_coverage/.coverage"
omit = [
    "*/fpga_project_*/*",
    "*/tests/*",
]

[tool.coverage.html]
directory = "/tmp/fpga_flow_audit_coverage/html"